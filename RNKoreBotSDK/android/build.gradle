buildscript {
    if (project == rootProject) {
        ext {
            buildToolsVersion = "36.0.0"
            minSdkVersion = 24
            compileSdkVersion = 36
            targetSdkVersion = 36
            ndkVersion = "27.1.12297006"
            kotlinVersion = "2.0.21"
        }

        repositories {
            google()
            mavenCentral()
        }
        dependencies {
            classpath("com.android.tools.build:gradle:8.8.2")
            classpath("com.facebook.react:react-native-gradle-plugin")
            classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21")
        }
    }
}

def safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

// This is the library build configuration. The host application supplies
// the React Native/Android toolchain values when this module is autolinked.
apply plugin: 'com.android.library'

android {
    compileSdk safeExtGet('compileSdkVersion', 36)
    namespace 'com.rnkorebotsdk'

    defaultConfig {
        minSdk safeExtGet('minSdkVersion', 24)
        targetSdk safeExtGet('targetSdkVersion', 36)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            matchingFallbacks = ['release']
        }
        release {
            minifyEnabled false
            matchingFallbacks = ['release']
        }
    }
}

repositories {
    google()
    mavenCentral()
    maven {
        url "$projectDir/../node_modules/react-native/android"
    }
}

dependencies {
    implementation "com.facebook.react:react-android"
}
